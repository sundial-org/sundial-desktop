[package]
name = "sundial-desktop"
version = "0.1.3"
description = "Sundial desktop wrapper"
authors = ["Sundial"]
edition = "2021"

[lib]
name = "sundial_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# On by default but inert until SUNDIAL_DEVTOOLS=1 — lets anyone inspect a
# misbehaving release build in the field.
default = ["devtools"]
devtools = ["tauri/devtools"]

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
serde_json = "1"
url = "2"
# Only the timer for the periodic update check — tauri's async runtime is tokio.
tokio = { version = "1", features = ["time"] }
